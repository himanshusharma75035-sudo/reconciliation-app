name: Secret Scan

# Scans for committed secrets (API keys, tokens, private keys) per the Eko
# open-source guidelines (secret-scanning-guide.md).
#
# Uses the gitleaks OSS binary directly. The gitleaks-action wrapper requires a paid
# GITLEAKS_LICENSE on ORG repos (which this is) and fails the job without one — the CLI
# has no such gate, so scanning actually runs. Verified clean across full history.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Run Gitleaks (OSS CLI — no license required)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
